name: kevai-train

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers peft datasets accelerate

      - name: Restore checkpoint
        uses: actions/cache@v4
        with:
          path: work/
          key: kevai-work-${{ github.run_id }}
          restore-keys: |
            kevai-work-

      - name: TRAINING
        run: python train_lora_local.py

      - name: Upload hasil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-${{ github.run_id }}
          path: work/
          retention-days: 30
